name: APK Android
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Descomprimir
        run: unzip -q smash2d.zip
      - name: Aplicar parche (PickPanel táctil)
        run: |
          if [ -f PickPanel.gd ]; then cp PickPanel.gd smash2d/scripts/ui/PickPanel.gd; fi
      - name: Instalar Godot y plantillas
        run: |
          V=3.5.3-stable
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux_headless.64.zip
          unzip -q godot.zip
          sudo mv Godot_v${V}_linux_headless.64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz
          mkdir -p ~/.local/share/godot/templates/3.5.3.stable ~/.config/godot
          unzip -q -j tpl.tpz 'templates/android_*' templates/version.txt -d ~/.local/share/godot/templates/3.5.3.stable
          ls ~/.local/share/godot/templates/3.5.3.stable
      - name: Configurar Android
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cd smash2d
          grep -q import_etc project.godot || sed -i 's|^quality/driver/driver_name="GLES2"|quality/driver/driver_name="GLES2"\nvram_compression/import_etc=true\nvram_compression/import_etc2=true|' project.godot
          grep -n -A3 '^\[rendering\]' project.godot
          godot --path . --editor --quit --headless || true
          cat > ~/.config/godot/editor_settings-3.tres <<EOF
          [gd_resource type="EditorSettings" format=2]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          ls ~/.config/godot
      - name: Exportar APK
        run: |
          cd smash2d
          mkdir -p build/android
          godot --path . --headless --export-debug "Android" build/android/Smash2D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Smash2D-apk
          path: smash2d/build/android/Smash2D.apk
          
