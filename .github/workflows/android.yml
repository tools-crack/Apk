name: APK Android
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: unzip -q smash2d.zip
      - name: Preparar
        working-directory: smash2d
        run: |
          mkdir -v -p ~/.local/share/godot/templates ~/.config/godot build/android
          mv /root/.local/share/godot/templates/3.5.3.stable ~/.local/share/godot/templates/3.5.3.stable || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          godot -v -e --quit --headless || true
          cat >> ~/.config/godot/editor_settings-3.tres <<'EOF'
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
      - name: Exportar APK
        working-directory: smash2d
        run: godot -v --headless --export-debug "Android" build/android/Smash2D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Smash2D-apk
          path: smash2d/build/android/Smash2D.apk
          
